<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת-על – אופנהיימר 128</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1d1b; --muted:#6b6b66; --line:#dcd8cd;
  --accent:#1f5c7a; --chip:#ece8dc;
  --h0:#bcd8e8; --h1:#0b3f5e;          /* heat scale: weak -> strong */
  --plotbg:#ffffff; --emptycol:#ece9e0; --rowline:#eeeae0;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#181a1b; --card:#222527; --ink:#e8e6e1; --muted:#9a9a93; --line:#3a3e40;
    --accent:#7fb8d6; --chip:#2e3234;
    --h0:#2c5368; --h1:#a6dcf6;
    --plotbg:#1b1e1f; --emptycol:#2a2e30; --rowline:#26292b; }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Arial,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card)}
h1{margin:0 0 2px;font-size:20px}
.sub{color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:end;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.bar label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:2px}
.bar label.chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:5px}
.bar select{font:inherit;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:150px}
.bar input[type=range]{width:140px}
.tabs{display:flex;gap:0}
.tab{font:inherit;padding:6px 14px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
.tab:first-child{border-radius:0 6px 6px 0}.tab:last-child{border-radius:6px 0 0 6px;border-right:0}
.tab.on{background:var(--accent);color:var(--card)}
.layout{display:flex;gap:14px;padding:12px 16px 30px;align-items:flex-start}
#side{width:270px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#side h3{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
.qb{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.qb button{font:inherit;font-size:13px;padding:2px 10px;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.qb button.off{opacity:.45;text-decoration:line-through}
#wlist{max-height:calc(100vh - 290px);overflow:auto;border-top:1px solid var(--line)}
.wrow{display:flex;align-items:center;gap:6px;padding:2px 2px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--rowline)}
.wrow:hover{background:var(--chip)}
.wrow .dot{width:9px;height:9px;border-radius:50%;flex:none}
.wrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .ct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.wrow.active{background:var(--accent);color:var(--card)}
.wrow.active .ct{color:inherit}
#plotWrap{flex:1;min-width:0}
#status{color:var(--muted);font-size:14px;margin-bottom:6px}
#scroller{overflow:auto;max-height:calc(100vh - 200px);border:1px solid var(--line);border-radius:10px;background:var(--plotbg);direction:ltr}
#plot{display:grid;grid-template-columns:var(--labw) auto;width:max-content}
#corner{position:sticky;top:0;left:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
#hdr{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);display:block}
#labels{position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--line)}
.lab{display:flex;align-items:center;gap:6px;padding:0 6px;font-size:12px;white-space:nowrap;overflow:hidden;border-bottom:1px solid var(--rowline);cursor:default}
.lab.hov{background:var(--chip)}
.lab .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lab .ct{color:var(--muted);font-variant-numeric:tabular-nums}
.lab .bd{width:4px;height:70%;border-radius:2px;flex:none}
#gridbox{position:relative}
#grid{display:block}
#hl{position:absolute;border:2px solid var(--ink);pointer-events:none;display:none;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;color:var(--muted);font-size:13px;margin-top:8px}
.grad{width:160px;height:12px;border-radius:3px;border:1px solid var(--line)}
.sw{display:inline-block;width:14px;height:12px;border:1px solid var(--line);vertical-align:middle}
#tip{position:fixed;z-index:20;pointer-events:none;display:none;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#tip b{font-size:14px}
#tip .m{margin-top:4px;padding-top:4px;border-top:1px solid var(--rowline)}
#tip .tg{color:var(--accent)}
@media (max-width:900px){
  .layout{flex-direction:column}
  #side{width:100%}
  #wlist{max-height:240px}
  #plotWrap{width:100%}
}
</style>

const BOOKS = {genesis:0,bereshit:0,exodus:1,shemot:1,leviticus:2,vayikra:2,numbers:3,bamidbar:3,deuteronomy:4,devarim:4};
const TRACTATES = ['Berakhot','Shabbat','Eruvin','Pesachim|Pesakhim','Shekalim','Yoma','Sukkah','Beitzah','Rosh Hashanah','Taanit','Megillah','Moed Katan','Chagigah',
  'Yevamot','Ketubot','Nedarim','Nazir','Sotah','Gittin','Kiddushin','Bava Kamma','Bava Metzia','Bava Batra','Sanhedrin','Makkot','Shevuot','Avodah Zarah','Horayot',
  'Zevachim','Menachot','Chullin','Bekhorot','Arakhin','Temurah','Keritot','Meilah','Tamid','Niddah'];
const norm = s => s.toLowerCase().replace(/[^a-z]/g, '');
const mkMap = list => { const m = new Map(); list.forEach((names, i) => names.split('|').forEach(n => m.set(norm(n), i))); return m; };
const PMAP = mkMap(PARASHOT), TMAP = mkMap(TRACTATES);
function rankPrefix(p) {                    // canonical order for parasha / tractate names; null if unknown
  const toks = p.replace(/^Parashat\s+/i, '').split(' ');
  if (toks.length > 1 && BOOKS[norm(toks[0])] !== undefined) {
    const r = norm(toks.slice(1).join(' ')); if (PMAP.has(r)) return PMAP.get(r);
  }
  const all = norm(toks.join(' '));
  if (PMAP.has(all)) return PMAP.get(all);
  if (BOOKS[all] !== undefined) return BOOK_START[BOOKS[all]] - 0.5;
  if (TMAP.has(all)) return 100 + TMAP.get(all);
  return null;
}
const isSupp = s => /supplement|addendum/i.test(s);
function cmpUnit(a, b) {                    // units are numbers or strings
  const ta = typeof a === 'number', tb = typeof b === 'number';
  if (ta && tb) return a - b;
  if (!ta && !tb) {
    if (isSupp(a) !== isSupp(b)) return isSupp(a) ? 1 : -1;
    const ra = rankPrefix(a), rb = rankPrefix(b);
    if (ra != null && rb != null) return ra - rb;
    if (ra != null) return 1; if (rb != null) return -1;     // unranked names (Hakdamah, Petichta...) come first
    return nat(a, b);
  }
  const s = ta ? b : a;                     // text goes before numbers, except supplements/addenda
  const textFirst = !isSupp(s);
  return ta ? (textFirst ? 1 : -1) : (textFirst ? -1 : 1);
}
const cmpUnits = (a, b) => {
  for (let i = 0; i < Math.min(a.length, b.length); i++) { const d = cmpUnit(a[i], b[i]); if (d) return d; }
  return a.length - b.length;
};
function parseLoc(loc) {                    // "28 Ot 1 6" -> {prefix:"28 Ot", nums:[1,6]}
  const t = loc.split(' '); let i = t.length;
  while (i > 0 && /^\d+$/.test(t[i - 1])) i--;
  return { prefix: t.slice(0, i).join(' '), nums: t.slice(i).map(Number) };
}
function workStructure(w) {                 // units per match + max depth for this work
  const ms = [...byWork[w].values()].flat();
  const parsed = ms.map(m => [m, parseLoc(m[2])]);
  const prefixes = new Set(parsed.map(([, p]) => p.prefix));
  const constant = prefixes.size === 1;
  const head = constant ? [...prefixes][0] : '';
  const units = new Map();
  let maxDepth = 1;
  for (const [m, p] of parsed) {
    const u = (!constant && p.prefix) ? [p.prefix, ...p.nums] : [...p.nums];
    units.set(m, u); maxDepth = Math.max(maxDepth, u.length);
  }
  return { head, units, maxDepth };
}
const structCache = new Map();
const wstruct = w => { if (!structCache.has(w)) structCache.set(w, workStructure(w)); return structCache.get(w); };

/* ---------- models ---------- */
function model1() {
  const idx = [...st.enabled];
  idx.sort((a, b) => st.sortBy === 'matches' ? (WORKS[b][3] - WORKS[a][3] || WORKS[b][2] - WORKS[a][2]) : (a - b));
  // 'a - b' keeps the sheet order = segments count (desc), then matches
  return idx.map(w => ({ label: WORKS[w][0], count: WORKS[w][2], band: typeColor(WORKS[w][1]), cells: byWork[w], work: w }));
}
function model2() {
  const w = st.work, { head, units, maxDepth } = wstruct(w);
  const depth = Math.min(st.depth || maxDepth, maxDepth);
  const groups = new Map();                 // key -> {units, cells:Map}
  for (const [m, u] of units) {
    const ku = u.slice(0, depth), key = ku.join('\u0001');
    if (!groups.has(key)) groups.set(key, { u: ku, cells: new Map() });
    const c = groups.get(key).cells;
    if (!c.has(m[0])) c.set(m[0], []);
    c.get(m[0]).push(m);
  }
  const rows = [...groups.values()].sort((a, b) => cmpUnits(a.u, b.u));
  return rows.map(g => ({ label: [head, ...g.u].filter(x => x !== '').join(' '), count: g.cells.size, band: null, cells: g.cells, work: w }));
}

/* ---------- drawing ---------- */
const $ = id => document.getElementById(id);
const cv = $('grid'), hd = $('hdr'), labs = $('labels'), hl = $('hl'), tip = $('tip');
let cur = null;                              // {rows, cols, rowH, cellW}
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function heatColor(S, c0, c1) {
  const t = Math.max(0, Math.min(1, (S - S_MIN) / (S_MAX - S_MIN)));
  return `rgb(${c0.map((v, i) => Math.round(v + (c1[i] - v) * t)).join(',')})`;
}
const maxS = ms => ms.reduce((a, m) => Math.max(a, m[3]), 0);

function render() {
  const rows = st.mode === 1 ? model1() : model2();
  const rowH = st.mode === 1 ? 18 : 14, cellW = st.cellW;
  // columns: all segments in manuscript order, optionally only those with a match in the displayed rows
  let cols = SEGS.map((_, i) => i);
  if (st.hideEmpty) {
    const has = new Set(); rows.forEach(r => r.cells.forEach((_, s) => has.add(s)));
    cols = cols.filter(s => has.has(s));
  }
  cur = { rows, cols, rowH, cellW };
  const W = cols.length * cellW, H = Math.max(rows.length * rowH, 1), dpr = window.devicePixelRatio || 1;
  document.documentElement.style.setProperty('--labw', st.mode === 1 ? '230px' : '170px');

  // grid
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = css('--plotbg'); g.fillRect(0, 0, W, H);
  g.fillStyle = css('--emptycol');
  cols.forEach((s, c) => { if (!segTotal[s]) g.fillRect(c * cellW, 0, cellW, H); });
  g.fillStyle = css('--rowline');
  for (let r = 1; r <= rows.length; r++) g.fillRect(0, r * rowH - 1, W, 1);
  const c0 = hex(css('--h0')), c1 = hex(css('--h1')), pres = css('--h1');
  const gap = cellW >= 6 ? 1 : 0;
  const colOf = new Map(cols.map((s, c) => [s, c]));
  rows.forEach((row, r) => {
    row.cells.forEach((ms, s) => {
      const c = colOf.get(s); if (c === undefined) return;
      g.fillStyle = st.color === 'S' ? heatColor(maxS(ms), c0, c1) : pres;
      g.fillRect(c * cellW, r * rowH, cellW - gap, rowH - 1);
    });
  });

  // labels
  labs.dir = st.mode === 1 ? 'rtl' : 'ltr';
  labs.innerHTML = '';
  rows.forEach((row, r) => {
    const d = document.createElement('div'); d.className = 'lab'; d.style.height = rowH + 'px';
    d.dataset.r = r;
    if (row.band) { const b = document.createElement('span'); b.className = 'bd'; b.style.background = row.band; d.appendChild(b); }
    const n = document.createElement('span'); n.className = 'nm'; n.textContent = row.label; n.title = row.label;
    const k = document.createElement('span'); k.className = 'ct'; k.textContent = row.count;
    d.append(n, k);
    if (st.mode === 1) { d.style.cursor = 'pointer'; d.title = 'לחיצה כפולה: מטריצה של החיבור הזה'; d.ondblclick = () => openMatrix(row.work); }
    labs.appendChild(d);
  });
  $('corner').style.height = '84px';

  drawHeader(W, dpr);
  const nm = rows.reduce((a, r) => a + [...r.cells.values()].reduce((x, ms) => x + ms.length, 0), 0);
  const empties = SEGS.filter((_, i) => !segTotal[i]).length;
  $('status').textContent = (st.mode === 1
    ? `${rows.length} חיבורים מוצגים מתוך ${WORKS.length}`
    : `${WORKS[st.work][0]} · ${rows.length} סעיפים`) +
    ` · ${cols.length} קטעים בציר · ${nm} התאמות · (${empties} קטעים בלי שום התאמה מעל הסף)`;
  drawLegend();
}

function drawHeader(W, dpr) {
  const h = 84;
  hd.width = W * dpr; hd.height = h * dpr; hd.style.width = W + 'px'; hd.style.height = h + 'px';
  const g = hd.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const { cols, cellW } = cur;
  g.fillStyle = css('--card'); g.fillRect(0, 0, W, h);
  // candidates: first segment of every folio side (e.g. "fol 12r")
  const cand = []; let last = null;
  cols.forEach((s, c) => {
    const key = SEGS[s][0].replace(/ \d+$/, '');
    if (key !== last) { cand.push([c, key.replace(/^fol /, '')]); last = key; }
  });
  const perCand = cand.length ? (cols.length * cellW) / cand.length : 1;
  const step = Math.max(1, Math.ceil(14 / perCand));
  g.fillStyle = css('--ink'); g.strokeStyle = css('--muted'); g.font = '11px "Segoe UI",Arial'; g.textBaseline = 'middle';
  cand.forEach(([c, name], i) => {
    if (i % step) return;
    const x = c * cellW + cellW / 2;
    g.beginPath(); g.moveTo(x, h - 5); g.lineTo(x, h); g.stroke();
    g.save(); g.translate(x, h - 8); g.rotate(-Math.PI / 2); g.textAlign = 'left'; g.fillText(name, 0, 0); g.restore();
  });
}

function drawLegend() {
  const L = $('legend');
  const sw = c => `<span class="sw" style="background:${c}"></span>`;
  L.innerHTML = (st.color === 'S'
    ? `<span>עוצמה S:</span><span dir="ltr" style="display:inline-flex;gap:6px;align-items:center">${S_MIN.toFixed(1)}<span class="grad" style="background:linear-gradient(to right,${css('--h0')},${css('--h1')})"></span>${S_MAX.toFixed(1)}</span>
       <span>(בתא עם כמה התאמות – הגבוהה ביותר)</span>`
    : `<span>${sw(css('--h1'))} יש התאמה</span>`) +
    `<span>${sw(css('--emptycol'))} קטע בלי שום התאמה מעל הסף</span>` +
    (st.mode === 1 ? `<span>פס צבעוני בשם החיבור = סוג החיבור</span>` : '');
}

/* ---------- side panel ---------- */
function buildSide() {
  const side = $('side'); side.innerHTML = '';
  if (st.mode === 1) {
    side.innerHTML = `<h3>הדלקה / כיבוי של חיבורים</h3>
      <div class="qb" id="qa"></div><div class="qb" id="qt"></div><div id="wlist"></div>`;
    const qa = $('qa');
    [['הכל', () => WORKS.forEach((_, i) => st.enabled.add(i))],
     ['אפס', () => st.enabled.clear()],
     ['10 המובילים', () => { st.enabled = new Set(WORKS.map((_, i) => i).sort((a, b) => a - b).slice(0, 10)); }],
    ].forEach(([t, f]) => { const b = document.createElement('button'); b.textContent = t; b.onclick = () => { f(); refreshSide(); render(); }; qa.appendChild(b); });
    const qt = $('qt');
    TYPES.forEach(t => {
      const b = document.createElement('button'); b.textContent = t; b.dataset.t = t;
      b.style.borderColor = typeColor(t);
      b.onclick = () => {
        const ids = WORKS.map((w, i) => w[1] === t ? i : -1).filter(i => i >= 0);
        const allOn = ids.every(i => st.enabled.has(i));
        ids.forEach(i => allOn ? st.enabled.delete(i) : st.enabled.add(i));
        refreshSide(); render();
      };
      qt.appendChild(b);
    });
    const wl = $('wlist');
    WORKS.forEach((w, i) => {
      const r = document.createElement('label'); r.className = 'wrow';
      r.innerHTML = `<input type="checkbox" data-w="${i}"><span class="dot" style="background:${typeColor(w[1])}"></span><span class="nm" title="${w[0]}">${w[0]}</span><span class="ct">${w[2]}</span>`;
      r.querySelector('input').onchange = e => { e.target.checked ? st.enabled.add(i) : st.enabled.delete(i); refreshSide(); render(); };
      wl.appendChild(r);
    });
    refreshSide();
  } else {
    side.innerHTML = `<h3>בחירת חיבור (לפי פופולריות · מספר קטעים)</h3><div id="wlist"></div>`;
    const wl = $('wlist');
    WORKS.forEach((w, i) => {
      const r = document.createElement('div'); r.className = 'wrow' + (i === st.work ? ' active' : '');
      r.innerHTML = `<span class="nm" title="${w[0]}">${w[0]}</span><span class="ct">${w[2]}</span>`;
      r.onclick = () => openMatrix(i);
      wl.appendChild(r);
    });
  }
}
function refreshSide() {                    // sync checkboxes / type chips with st.enabled
  document.querySelectorAll('#wlist input[data-w]').forEach(c => c.checked = st.enabled.has(+c.dataset.w));
  document.querySelectorAll('#qt button').forEach(b => {
    const ids = WORKS.map((w, i) => w[1] === b.dataset.t ? i : -1).filter(i => i >= 0);
    b.classList.toggle('off', !ids.some(i => st.enabled.has(i)));
  });
}
function setDepthOptions() {
  const { maxDepth } = wstruct(st.work);
  const sel = $('depth'); sel.innerHTML = '';
  for (let d = 1; d <= maxDepth; d++) {
    const o = document.createElement('option'); o.value = d;
    o.textContent = d === maxDepth ? `${d} · מפורט (מראה מקום מלא)` : `${d}${d === 1 ? ' · גס' : ''}`;
    sel.appendChild(o);
  }
  st.depth = maxDepth; sel.value = maxDepth;
}
function openMatrix(w) { st.work = w; setMode(2); }
function setMode(m) {
  st.mode = m;
  $('tab1').classList.toggle('on', m === 1); $('tab2').classList.toggle('on', m === 2);
  $('sortWrap').hidden = m !== 1; $('depthWrap').hidden = m !== 2;
  if (m === 2) setDepthOptions();
  buildSide(); render();
  if (m === 2) document.querySelector('#wlist .wrow.active')?.scrollIntoView({ block: 'nearest' });
}

/* ---------- hover ---------- */
$('gridbox').addEventListener('mousemove', e => {
  const b = $('gridbox').getBoundingClientRect();
  const x = e.clientX - b.left, y = e.clientY - b.top;
  const c = Math.floor(x / cur.cellW), r = Math.floor(y / cur.rowH);
  document.querySelectorAll('.lab.hov').forEach(l => l.classList.remove('hov'));
  if (c < 0 || r < 0 || c >= cur.cols.length || r >= cur.rows.length) { hl.style.display = 'none'; tip.style.display = 'none'; return; }
  const s = cur.cols[c], row = cur.rows[r], ms = row.cells.get(s);
  labs.children[r]?.classList.add('hov');
  hl.style.display = 'block';
  hl.style.left = c * cur.cellW - 1 + 'px'; hl.style.top = r * cur.rowH - 1 + 'px';
  hl.style.width = Math.max(cur.cellW, 4) + 2 + 'px'; hl.style.height = cur.rowH + 1 + 'px';
  let h = `<b>${SEGS[s][0]}</b> · ${row.label}`;
  if (!ms) h += `<div style="color:var(--muted)">אין התאמה</div>`;
  else ms.slice().sort((a, b) => b[3] - a[3]).forEach(m => {
    h += `<div class="m">${WORKS[m[1]][0]} · <bdi dir="ltr">${m[2]}</bdi><br>S = ${m[3].toFixed(2)} · דירוג ב-ACT: ${m[4]}${m[5] ? ` · <span class="tg">${m[5]}</span>` : ''}</div>`;
  });
  tip.innerHTML = h; tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tw - 8) + 'px';
  tip.style.top = Math.min(e.clientY + 14, innerHeight - th - 8) + 'px';
});
$('gridbox').addEventListener('mouseleave', () => {
  hl.style.display = 'none'; tip.style.display = 'none';
  document.querySelectorAll('.lab.hov').forEach(l => l.classList.remove('hov'));
});

/* ---------- wiring ---------- */
$('tab1').onclick = () => setMode(1);
$('tab2').onclick = () => setMode(2);
$('colorMode').onchange = e => { st.color = e.target.value; render(); };
$('sortBy').onchange = e => { st.sortBy = e.target.value; render(); };
$('depth').onchange = e => { st.depth = +e.target.value; render(); };
$('cellW').oninput = e => { st.cellW = +e.target.value; render(); };
$('hideEmpty').onchange = e => { st.hideEmpty = e.target.checked; render(); };
dark.addEventListener('change', () => { buildSide(); render(); });

// consistency check: report locator prefixes that have no canonical ordering (falls back to alphabetical)
{ const un = new Set();
  WORKS.forEach((w, i) => { const s = wstruct(i); s.units.forEach(u => { if (typeof u[0] === 'string' && rankPrefix(u[0]) == null) un.add(w[0] + ': ' + u[0]); }); });
  if (un.size) console.info('prefixes ordered alphabetically (no canonical order known):', [...un]); }

setMode(1);
</script>
<script>
/* integration (2026-11-18): click a cell to open that manuscript segment in the explorer, in a new tab */
document.getElementById('gridbox').addEventListener('click', e => {
  if (!cur) return;
  const b = e.currentTarget.getBoundingClientRect(), c = Math.floor((e.clientX - b.left) / cur.cellW);
  if (c < 0 || c >= cur.cols.length) return;
  const seg = SEGS[cur.cols[c]]; if (!seg) return;
  window.open('../explorer/#passages/' + encodeURIComponent(seg[1]), '_blank', 'noopener');
});
document.getElementById('gridbox').style.cursor = 'pointer';
</script>
